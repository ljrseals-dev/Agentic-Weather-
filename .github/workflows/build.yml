name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GCC
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -o weather agentic_weather_map.cpp
      - name: Smoke test CLI
        run: |
          ./weather --help
          ./weather --steps 1 --delay 0 --seed 1234 > /tmp/weather-smoke.txt
          test -s /tmp/weather-smoke.txt
          if ./weather --steps -1 >/dev/null 2>&1; then exit 1; fi
